<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff4f87"><link rel="manifest" href="manifest.json"><title>Bettuu: The Secret Mission</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#120b18;color:#fff;min-height:100vh}button{font:inherit;touch-action:manipulation}
#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 20% 10%,#542044 0,transparent 35%),radial-gradient(circle at 90% 80%,#34205c 0,transparent 35%),#120b18}.box{width:min(720px,100%);background:#ffffff0e;border:1px solid #ffffff22;border-radius:28px;padding:24px;box-shadow:0 20px 80px #0007;backdrop-filter:blur(12px)}h1,h2{margin:0 0 12px}h1{font-size:clamp(2.4rem,11vw,5rem);line-height:.95;color:#ff82a9}h2{font-size:clamp(1.6rem,7vw,2.7rem)}p{line-height:1.65;color:#eadde8}.tag{font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:#ff9cba}.btn{width:100%;border:0;border-radius:16px;padding:15px 18px;margin-top:10px;background:#ff4f87;color:white;font-weight:800;box-shadow:0 10px 25px #ff4f8735}.btn.alt{background:#ffffff12;border:1px solid #ffffff25}.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:18px}.pill{padding:8px 12px;border-radius:99px;background:#ffffff12;font-size:.85rem}.hidden{display:none!important}.choice{width:100%;text-align:left;background:#ffffff0b;color:#fff;border:1px solid #ffffff20;border-radius:15px;padding:15px;margin:7px 0}.choice:active{transform:scale(.99)}.choice.correct{background:#1d9b6730;border-color:#48d99a}.choice.wrong{background:#d53d5830;border-color:#ff7186}.meter{height:10px;background:#ffffff15;border-radius:99px;overflow:hidden;margin:16px 0}.fill{height:100%;background:linear-gradient(90deg,#ff4f87,#ffb36e);width:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tile{aspect-ratio:1;border:1px solid #ffffff22;border-radius:15px;background:#ffffff0a;color:#fff;font-size:1.6rem}.tile.done{background:#ff4f8730}.lock{font-size:3.5rem}.small{font-size:.82rem;color:#b9aab7}.heart{position:fixed;font-size:28px;pointer-events:none;animation:pop .8s forwards;z-index:5}@keyframes pop{to{transform:translateY(-100px) scale(1.8);opacity:0}}
</style></head><body><main id="app"></main>
<script>
const app=document.getElementById('app');let level=0,lives=3,score=0;
const state={clues:[],memory:0};
function shell(inner){app.innerHTML='<div class="box">'+inner+'</div>'}
function home(){shell('<div class="tag">A secret mission from Baccha</div><h1>Bettuu:<br>The Secret Mission</h1><p>Ankit, your Baccha has hidden a surprise behind <b>5 missions</b>. Solve them, collect the keys, and unlock the final message.</p><p>❤️ 5 missions &nbsp; 🔑 5 keys &nbsp; 🏆 1 final prize</p><button class="btn" onclick="start()">START MISSION</button><p class="small">Best played on Android Chrome. Touch-friendly. No download needed once hosted.</p>')}
function hud(){return '<div class="top"><span class="pill">❤️ '+score+'</span><span class="pill">🔑 '+state.clues.length+'/5</span><span class="pill">💗 '+lives+' lives</span></div>'}
function start(){level=1;lives=3;score=0;state.clues=[];mission1()}
function lose(){lives--;if(lives<=0){shell('<div class="lock">💔</div><h2>Mission failed, Bettuu 😭</h2><p>Your Baccha says: “Try again. I know you can do it.”</p><button class="btn" onclick="start()">RESTART</button>');}else{mission1()}}
function key(){state.clues.push(level);score+=100;burst();level++;setTimeout(()=>level===2?mission2():level===3?mission3():level===4?mission4():level===5?mission5():final(),250)}
function mission1(){shell(hud()+'<div class="tag">Mission 1 — The Date Lock</div><h2>When did the Bettuu story begin?</h2><p>Pick the date that unlocks the first key.</p>'+['14 February 2023','21 February 2023','29 March 2023','21 February 2022'].map((x,i)=>'<button class="choice" onclick="ans(this,'+(i===1)+')">'+x+'</button>').join(''))}
function ans(el,ok){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);el.classList.add(ok?'correct':'wrong');if(ok){score+=50;key()}else{setTimeout(lose,500)}}
function mission2(){shell(hud()+'<div class="tag">Mission 2 — Baccha Decoder</div><h2>Choose the nickname only YOU get.</h2><p>What does Ankit call Sneha?</p>'+['Princess','Baccha','Boss Lady','Kuchupuchuuu'].map((x,i)=>'<button class="choice" onclick="ans(this,'+(i===1)+')">'+x+'</button>').join(''))}
function mission3(){shell(hud()+'<div class="tag">Mission 3 — Memory Grid</div><h2>Find the three matching pairs.</h2><p>Tap two tiles at a time. You have to clear the board.</p><div class="grid" id="grid"></div>');let vals=['👀','💋','🌷','👀','💋','🌷'];vals.sort(()=>Math.random()-.5);let first=null,busy=false,done=0;vals.forEach((v,i)=>{let b=document.createElement('button');b.className='tile';b.textContent='?';b.onclick=()=>{if(busy||b.classList.contains('done')||b===first)return;b.textContent=v;if(!first){first=b;return}busy=true;if(first.textContent===b.textContent){first.classList.add('done');b.classList.add('done');done++;score+=40;first=null;busy=false;if(done===3)setTimeout(key,350)}else{setTimeout(()=>{first.textContent='?';b.textContent='?';first=null;busy=false;},550)}};document.getElementById('grid').appendChild(b)})}
function mission4(){shell(hud()+'<div class="tag">Mission 4 — The Truth Detector</div><h2>Which one sounds most like your Baccha?</h2><p>Only one answer is the correct level-up.</p>'+['She is more romantic than Ankit.','She loves his eyes, smile and kisses.','She has never called him Bettuu.','She is not proud of him.'].map((x,i)=>'<button class="choice" onclick="ans(this,'+(i===1)+')">'+x+'</button>').join(''))}
function mission5(){shell(hud()+'<div class="tag">Mission 5 — The Final Code</div><h2>Build the code.</h2><p>Tap the letters in the correct order: <b>BETTUU</b></p><div class="grid" id="letters"></div><p id="code" class="small"></p>');let letters=['B','E','T','T','U','U'];letters.sort(()=>Math.random()-.5);let order='';letters.forEach((v)=>{let b=document.createElement('button');b.className='tile';b.textContent=v;b.onclick=()=>{if(b.disabled)return;order+=v;b.disabled=true;b.classList.add('done');document.getElementById('code').textContent=order;if(order.length===6){if(order==='BETTUU'){score+=200;key()}else{setTimeout(()=>mission5(),500)}}};document.getElementById('letters').appendChild(b)})}
function final(){shell('<div class="lock">🏆</div><div class="tag">Mission complete</div><h1>You did it, Bettuuuu.</h1><p>You found all 5 keys. But your final reward isn't points.</p><button class="btn" onclick="prize()">UNLOCK THE PRIZE 🔐</button>')}
function prize(){shell('<div class="tag">FROM YOUR BACCHA</div><h1>Hi Puttuu Babyyy. ❤️</h1><p>I made you play a whole game just so I could tell you something very simple.</p><p>I am <b>so proud of you</b> — for being yourself, for building yourself, and for becoming the person you want to be.</p><p>I love your eyes. Your smile. Your kisses. The way you love me. And the fact that you are soooo much more romantic than me. 😂</p><p>Thank you for being my Bettuu since <b>21 February 2023</b>.</p><p style="font-size:1.3rem"><b>I love youuuuu. ❤️</b></p><button class="btn" onclick="burstMany()">ONE LAST THING 💋</button><p id="kiss" class="small"></p>')}
function burst(){for(let i=0;i<8;i++){let e=document.createElement('div');e.className='heart';e.textContent=['❤️','💗','✨'][Math.floor(Math.random()*3)];e.style.left=(30+Math.random()*40)+'vw';e.style.top=(45+Math.random()*20)+'vh';document.body.appendChild(e);setTimeout(()=>e.remove(),900)}}
function burstMany(){burst();burst();document.getElementById('kiss').textContent='Your Baccha has officially sent you a kiss. Now come collect it. 😌💋'}
home();
</script></body></html>
