<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff4f87"><link rel="manifest" href="manifest.json"><title>The Bettuu Experience</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#120b18;color:#fff;font-family:system-ui,sans-serif;min-height:100vh}button{font:inherit;touch-action:manipulation}.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 20% 10%,#572344,transparent 35%),radial-gradient(circle at 90% 80%,#34205c,transparent 35%),#120b18}.box{width:min(700px,100%);padding:24px;background:#ffffff0d;border:1px solid #ffffff20;border-radius:28px;box-shadow:0 20px 80px #0008;backdrop-filter:blur(12px)}h1{font-size:clamp(2.5rem,12vw,5rem);line-height:.88;margin:8px 0;color:#ff82a9}h2{font-size:clamp(1.7rem,7vw,3rem)}p{line-height:1.65;color:#eadde8}.tag{font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:#ff9cba}.btn,.choice{width:100%;border-radius:16px;padding:15px;margin:7px 0;font-weight:800}.btn{border:0;background:#ff4f87;color:#fff;box-shadow:0 10px 25px #ff4f8735}.choice{background:#ffffff0b;color:#fff;border:1px solid #ffffff22;text-align:left}.choice:active{transform:scale(.98)}.hud{display:flex;justify-content:space-between;gap:6px;margin-bottom:20px}.pill{padding:8px 10px;background:#ffffff12;border-radius:99px;font-size:.8rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tile{aspect-ratio:1;border:1px solid #ffffff20;border-radius:15px;background:#ffffff09;color:#fff;font-size:1.6rem}.tile.done{background:#ff4f8733}.small{font-size:.8rem;color:#b9aab7}.big{text-align:center;font-size:4rem}.heart{position:fixed;pointer-events:none;animation:up 1s forwards;font-size:28px}@keyframes up{to{transform:translateY(-120px) scale(1.8);opacity:0}}</style></head><body><div class="app"><div id="game" class="box"></div></div><script>
let score=0,lives=3,level=0,keys=0;const G=document.getElementById('game');const hud=()=>'<div class="hud"><span class="pill">⭐ '+score+'</span><span class="pill">🔑 '+keys+'/5</span><span class="pill">❤️ '+lives+'</span></div>';const shell=x=>G.innerHTML=x;
function home(){shell('<div class="tag">A game from Baccha</div><div class="big">🎮</div><h1>THE<br>BETTUU<br>EXPERIENCE™</h1><p>Ankit, your Baccha has hidden a surprise behind <b>5 missions</b>. Solve them, collect the keys and unlock your prize.</p><p>🧠 puzzles · 😂 chaos · 💗 memories · 🎁 secret ending</p><button class="btn" onclick="start()">ENTER THE GAME</button><p class="small">Made for Android touch screens. No app installation needed when opened from the web.</p>')}
function start(){score=0;lives=3;keys=0;level=1;render()}function wrong(){lives--;if(lives<1){shell('<div class="big">😭</div><h2>Mission failed, Bettuu.</h2><p>Your Baccha says: “Try again, sir.”</p><button class="btn" onclick="start()">RESTART</button>')}else render()}function win(){score+=100;keys++;burst();level++;setTimeout(render,450)}function render(){if(level===1)m1();else if(level===2)m2();else if(level===3)m3();else if(level===4)m4();else if(level===5)m5();else final()}function answer(ok,b){b.disabled=true;b.style.borderColor=ok?'#55dba4':'#ff7186';if(ok)win();else setTimeout(wrong,450)}
function m1(){shell(hud()+'<div class="tag">MISSION 1 · THE DATE LOCK</div><h2>When did the Bettuu story begin?</h2><p>Choose the date that unlocks Key #1.</p>'+['14 February 2023','21 February 2023','29 March 2023','21 February 2022'].map((x,i)=>'<button class="choice" onclick="answer('+(i===1)+',this)">'+x+'</button>').join(''))}
function m2(){shell(hud()+'<div class="tag">MISSION 2 · BACCHA DECODER</div><h2>What does Ankit call Sneha?</h2><p>Only one nickname is the real password.</p>'+['Princess','Baccha','Boss Lady','Madam'].map((x,i)=>'<button class="choice" onclick="answer('+(i===1)+',this)">'+x+'</button>').join(''))}
function m3(){shell(hud()+'<div class="tag">MISSION 3 · MEMORY MATCH</div><h2>Find the 3 matching pairs.</h2><p>Tap tiles two at a time.</p><div class="grid" id="grid"></div>');let a=['👀','💋','🌷','👀','💋','🌷'].sort(()=>Math.random()-.5),first=null,busy=false,done=0;a.forEach(v=>{let b=document.createElement('button');b.className='tile';b.textContent='?';b.onclick=()=>{if(busy||b.classList.contains('done'))return;b.textContent=v;if(!first){first=b;return}busy=true;if(first.textContent===v){first.classList.add('done');b.classList.add('done');done++;score+=40;first=null;busy=false;if(done===3)win()}else setTimeout(()=>{first.textContent='?';b.textContent='?';first=null;busy=false},500)};grid.appendChild(b)})}
function m4(){shell(hud()+'<div class="tag">MISSION 4 · TRUTH DETECTOR</div><h2>Which one is true?</h2><p>Your Baccha left four statements. One is definitely true.</p>'+['Sneha is more romantic than Ankit.','Sneha loves Ankit’s eyes, smile and kisses.','Sneha is not proud of Ankit.','Sneha has never called him Bettuu.'].map((x,i)=>'<button class="choice" onclick="answer('+(i===1)+',this)">'+x+'</button>').join(''))}
function m5(){shell(hud()+'<div class="tag">MISSION 5 · THE FINAL CODE</div><h2>Build the password.</h2><p>Tap the letters in this exact order: <b>BETTUU</b></p><div class="grid" id="letters"></div><p id="code" class="small"></p>');let a=['B','E','T','T','U','U'].sort(()=>Math.random()-.5),out='';a.forEach(v=>{let b=document.createElement('button');b.className='tile';b.textContent=v;b.onclick=()=>{if(b.disabled)return;out+=v;b.disabled=true;b.classList.add('done');code.textContent=out;if(out.length===6){if(out==='BETTUU')win();else setTimeout(m5,400)}};letters.appendChild(b)})}
function final(){shell('<div class="big">🏆💗</div><div class="tag">ALL KEYS FOUND</div><h1>You did it, Bettuuuu.</h1><p>You survived five missions. But the final reward isn’t points.</p><button class="btn" onclick="prize()">UNLOCK THE PRIZE 🔐</button>')}
function prize(){shell('<div class="tag">FROM YOUR BACCHA</div><h1>Hi Puttuu Babyyy. ❤️</h1><p>I made you play a whole game just to tell you something simple.</p><p>I am <b>so proud of you</b> — for being yourself, for building yourself, and for becoming the person you want to be.</p><p>I love your passion, your eyes, your smile, your kisses, and the way you love me. And yes, you are soooo much more romantic than me. 😂❤️</p><p>Thank you for being my Bettuu since <b>21 February 2023</b>.</p><p style="font-size:1.3rem"><b>I love youuuuu.</b></p><button class="btn" onclick="kiss()">ONE LAST THING 💋</button>')}function kiss(){for(let i=0;i<20;i++){let e=document.createElement('div');e.className='heart';e.textContent=['❤️','💗','✨','💋'][Math.floor(Math.random()*4)];e.style.left=Math.random()*100+'vw';e.style.top=(60+Math.random()*30)+'vh';document.body.appendChild(e);setTimeout(()=>e.remove(),1100)}setTimeout(()=>alert('Your Baccha says: now come collect your kiss. 😌💋'),250)}home();
</script></body></html>
